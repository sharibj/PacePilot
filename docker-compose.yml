services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_dev}
      POSTGRES_DB: ${DB_NAME:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      HAI_API_BASE: ${HAI_API_BASE:-http://host.docker.internal:6655/openai/v1}
      HAI_API_KEY: ${HAI_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-sk-anything}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm/litellm_config.yaml:/app/config.yaml:ro

  # Observability: OTel Collector + Prometheus + Tempo + Loki + Grafana in one image.
  lgtm:
    image: grafana/otel-lgtm:0.11.9
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app_dev}
      FRONTEND_URL: http://localhost:5173
      LLM_API_BASE: http://litellm:4000
      LLM_API_KEY: ${LLM_API_KEY:-sk-anything}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      APP_NAME: ${APP_NAME:-pace-pilot}
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
      OTEL_LOGS_URL: http://lgtm:4318/v1/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  pgdata:
