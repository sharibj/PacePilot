services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_dev}
      POSTGRES_DB: ${DB_NAME:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      HAI_API_BASE: ${HAI_API_BASE:-http://host.docker.internal:6655/openai/v1}
      HAI_API_KEY: ${HAI_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-sk-anything}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm/litellm_config.yaml:/app/config.yaml:ro

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pacer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pacer_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Observability: OTel Collector + Prometheus + Tempo + Loki + Grafana in one image.
  lgtm:
    image: grafana/otel-lgtm:0.11.9
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app_dev}
      FRONTEND_URL: http://localhost:5173,http://localhost:8090
      LLM_API_BASE: http://litellm:4000
      LLM_API_KEY: ${LLM_API_KEY:-sk-anything}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      APP_NAME: ${APP_NAME:-pace-pilot}
      # RabbitMQ (pacer event broker)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-pacer}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pacer_dev}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      # Pacer agentic decision (n8n) — stubbed for now; fallback cue used if unset.
      N8N_PACER_WEBHOOK_URL: ${N8N_PACER_WEBHOOK_URL:-}
      N8N_PLANNER_WEBHOOK_URL: ${N8N_PLANNER_WEBHOOK_URL:-}
      # TTS (ElevenLabs) — text-only fallback when the API key is unset.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_BASE_URL: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-mp3_44100_128}
      # Pacer tuning (lowered for a snappier live demo)
      PACER_AGGREGATOR_WINDOW_SECONDS: ${PACER_AGGREGATOR_WINDOW_SECONDS:-8}
      PACER_AGGREGATOR_MIN_SAMPLES_FOR_DRIFT: ${PACER_AGGREGATOR_MIN_SAMPLES_FOR_DRIFT:-2}
      PACER_AGGREGATOR_PACE_DRIFT_FRACTION: ${PACER_AGGREGATOR_PACE_DRIFT_FRACTION:-0.04}
      PACER_AGGREGATOR_HR_DRIFT_BPM: ${PACER_AGGREGATOR_HR_DRIFT_BPM:-4.0}
      PACER_CUE_COOLDOWN_SECONDS: ${PACER_CUE_COOLDOWN_SECONDS:-5}
      PACER_N8N_TIMEOUT_MS: ${PACER_N8N_TIMEOUT_MS:-1200}
      PACER_MAX_HR_GUARDRAIL: ${PACER_MAX_HR_GUARDRAIL:-190}
      OTEL_METRICS_URL: http://lgtm:4318/v1/metrics
      OTEL_TRACES_URL: http://lgtm:4318/v1/traces
      OTEL_LOGS_URL: http://lgtm:4318/v1/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      litellm:
        condition: service_started
      lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

  # ---- n8n stack (pacer + planner agentic workflows) ----
  # n8n, its Redis chat-memory, and the memory MCP bridge all run on the project
  # network so the backend reaches the webhook as http://n8n:5678 (no host.docker.internal
  # hairpin). These flags are required: runners enabled, settings-file permission
  # enforcement, and insecure cookie so the editor works over plain http.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.23.3
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  n8n-redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${N8N_REDIS_PASSWORD:-n8n-redis-password}" --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - n8n_redis_data:/data
    restart: unless-stopped

  # Bridges the stdio-only @modelcontextprotocol/server-memory to StreamableHTTP/SSE
  # via mcp-proxy so n8n's MCP Client Tool node can reach it at http://mcp-memory:8000/mcp.
  mcp-memory:
    build:
      context: ./docker/mcp-memory
    ports:
      - "8011:8000"
    volumes:
      - n8n_mcp_memory:/data
    restart: unless-stopped

volumes:
  pgdata:
  n8n_data:
  n8n_redis_data:
  n8n_mcp_memory:
