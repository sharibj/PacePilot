server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:scaffold-fullstack-java}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pacer}
    password: ${RABBITMQ_PASSWORD:pacer_dev}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        default-requeue-rejected: false
  ai:
    openai:
      base-url: ${LLM_API_BASE:http://localhost:4000}
      api-key: ${LLM_API_KEY:sk-anything}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}

pacer:
  cue:
    cooldown-seconds: ${PACER_CUE_COOLDOWN_SECONDS:20}
  n8n:
    pacer-webhook-url: ${N8N_PACER_WEBHOOK_URL:}
    timeout-ms: ${PACER_N8N_TIMEOUT_MS:1200}
    planner-webhook-url: ${N8N_PLANNER_WEBHOOK_URL:}
    planner-timeout-ms: ${PACER_N8N_PLANNER_TIMEOUT_MS:120000}
  tts:
    elevenlabs-api-key: ${ELEVENLABS_API_KEY:}
    elevenlabs-voice-id: ${ELEVENLABS_VOICE_ID:}
    elevenlabs-base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    elevenlabs-model-id: ${ELEVENLABS_MODEL_ID:eleven_flash_v2_5}
    elevenlabs-output-format: ${ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
  guardrail:
    max-hr: ${PACER_MAX_HR_GUARDRAIL:190}
