server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:scaffold-fullstack-java}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: ${LLM_API_BASE:http://localhost:4000}
      api-key: ${LLM_API_KEY:sk-anything}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 10s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
